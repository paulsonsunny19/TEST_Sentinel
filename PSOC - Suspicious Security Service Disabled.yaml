id: c39da402-bd03-43c1-b7d2-47a7bcc4402b
name: PSOC - Suspicious Security Service Disabled
kind: Scheduled
description: Detects modification of the registry to disable security services
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1112
query: |-
  //Detects modification of the registry to disable security services
  let eventtype = dynamic(["RegistryValueSet"]);
  let RegistryValue = dynamic(["Start"]);
  let RegistryValueData = dynamic(["DWORD (0x00000004)"]);
  _Im_RegistryEvent(eventtype_in=eventtype,registryvalue_has_any=RegistryValue,registrydata_has_any=RegistryValueData)		
  | where RegistryKey has_any ("HKLM\\SYSTEM\\CurrentControlSet\\Services","HKLM\\SYSTEM\\ControlSet001\\Services","HKLM\\SYSTEM\\ControlSet002 \\Services")
  | where RegistryKey has_any ("appidsvc","msmpsvc","nissrv","securityhealthservice","sense","usosvc","wdboot","wdfilter","wdnisdrv","wdnissvc","windefend","wscsvc","wuauserv")
  | extend
      Computer = tostring(column_ifexists("DvcHostname", "")),
      Account = tostring(column_ifexists("ActorUsername", "")),
      CommandLine = tostring(column_ifexists("ActingProcessCommandLine", "")),
      ProcessId = tostring(column_ifexists("ActingProcessId", ""))
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

