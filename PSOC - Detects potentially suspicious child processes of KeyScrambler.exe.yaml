id: 9bd6d402-b493-4f5e-b6d1-36214b554261
name: PSOC - Detects potentially suspicious child processes of KeyScrambler.exe
kind: Scheduled
description: |-
  This rule checks for the use of KeyScramber by attackers to open a shell.
  This was observed in previous attacks.
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Execution
- DefenseEvasion
relevantTechniques:
- T1569
- T0849
query: |-
  //This rule checks for exploitation of keyscrambler to open a shell to an attacker
  let ProcessNames = dynamic(["cmd.exe", "script.exe", "mshta.exe", "powershell.exe", "pwsh.exe", "regsvr32.exe", "rundll32.exe", "wscript.exe"]);
  _Im_ProcessCreate(targetprocess_has_any=ProcessNames,parentprocess_has_any="keyscrambler.exe")
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
alertDetailsOverride:
  alertDynamicProperties: []
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

