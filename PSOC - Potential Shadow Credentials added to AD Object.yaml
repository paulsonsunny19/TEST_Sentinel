id: c0e48913-1a4e-4573-8a65-9e0eab413e14
name: PSOC - Potential Shadow Credentials added to AD Object
kind: Scheduled
description: detects the use of shadow credentials
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1556
query: |+
  //detects the use of shadow credentials
  union Event, SecurityEvent 
  | where EventID == 5136 
  | parse EventData with * 'ObjectDN">' ObjectDN "<" * 
  | parse EventData with * 'AttributeLDAPDisplayName">' ModifiedAttribute "<" * 
  | where ModifiedAttribute == "msDS-KeyCredentialLink"
  | project Computer , TimeGenerated , Activity, ObjectDN, ModifiedAttribute
  | extend
      ComputerName = tostring(column_ifexists("Computer", "")),
      DirectoryObject = tostring(column_ifexists("ObjectDN", ""))
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: ComputerName
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

