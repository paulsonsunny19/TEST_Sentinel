id: dba8c4d4-e89e-41a7-96dd-b71ded983f85
name: PSOC - LSA Protection Bypass
kind: Scheduled
description: LSASS (Local Security Authority Subsystem Service) is a critical Windows process responsible for enforcing security policies. Attackers often target LSASS to dump credentials, but modern systems employ LSA Protection to block unauthorized access. This detects attempts to bypass this protection.
severity: High
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1003
query: |-
  let LSA_Protection_Bypass_via_Load_Driver =
  SecurityEvent
  | where EventID == 4697
  | where ServiceName has_any ("mimidrv","RTCore32","RTCore64")
  | where ServiceStartType == "2"
  | where ServiceType == "0x1";
  let LSA_Protection_Bypass_via_registry_key =
  SecurityEvent
  | where EventID == 4657
  | where ObjectName has "\\REGISTRY\\MACHINE\\SYSTEM\\ControlSet001\\Control\\Lsa"
  | where tolower(ObjectValueName) == "runasppl"
  | where NewValue == "0";
  let Parent_Process = dynamic(["cmd.exe","powershell.exe"]);
  let cmd = dynamic(["\\HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa"]);
  let cmd_all = dynamic(["/v RunAsPPL","/t REG_DWORD", "/d 0"]);
  let LSA_Protection_Bypass_via_commandline = _Im_ProcessCreate(targetprocess_has_any="reg.exe",parentprocess_has_any=Parent_Process, commandline_has_all=cmd_all, commandline_has_any=cmd);
  union isfuzzy=true
  LSA_Protection_Bypass_via_Load_Driver, LSA_Protection_Bypass_via_registry_key, LSA_Protection_Bypass_via_commandline
  | extend
      Computer = tostring(coalesce(
          column_ifexists("Computer", ""),
          column_ifexists("DvcHostname", "")
      )),
      Account = tostring(coalesce(
          column_ifexists("SubjectUserName", ""),
          column_ifexists("ActorUsername", ""),
          column_ifexists("Account", "")
      )),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLineMapped = tostring(column_ifexists("CommandLine", ""))
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLineMapped
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

