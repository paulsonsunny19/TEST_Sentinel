id: 43dfb01d-dad8-4b37-be8d-55821484d98c
name: PSOC - Win/AD PEAs Privilege Escalation Script Detected
kind: Scheduled
description: |-
  detects winpeas by filename.
  in many real attacks, attackers use the default naming.
severity: High
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Discovery
relevantTechniques:
- T1082
- T1087
query: |-
  // Detects winpeas, winpeas is a priv esc tool used by attackers. 
  // this checks for the named file, as seen in real attacks the attacker rarely renames the file
  let ProcessNames = dynamic(["winpease.exe","adpeas.exe","winpease.bat","adpeas.bat","winpease.ps1","adpeas.ps1"]);
  _Im_ProcessCreate(targetprocess_has_any=ProcessNames)
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

