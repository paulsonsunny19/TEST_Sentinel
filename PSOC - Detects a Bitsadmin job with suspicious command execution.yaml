id: eccf4362-d175-4292-9d45-f9481182e614
name: PSOC - Detects a Bitsadmin job with suspicious command execution
kind: Scheduled
description: |-
  Detects suspicious bitsadmin usage
  BITSAdmin is a command-line tool built into Microsoft Windows that allows for queuing file transfer jobs, but has been used by threat actores for exfilration
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
- Persistence
relevantTechniques:
- T1197
query: |-
  // Detects suspicious bitsadmin usage
  //  BITSAdmin is a command-line tool built into Microsoft Windows that allows for queuing file transfer jobs, but has been used by threat actores for exfilration
  let cmd_any = dynamic(["addfile","create","resume","complete"]);
  let ProcessNames = dynamic(["bitsadmin.exe"]);
  _Im_ProcessCreate(targetprocess_has_any=ProcessNames,commandline_has_any=cmd_any)
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

