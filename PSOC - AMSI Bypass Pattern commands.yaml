id: 2d95336d-2906-4015-b6fc-99c6c65c0af7
name: PSOC - AMSI Bypass Pattern commands
kind: Scheduled
description: Detects commands used to bypass AMSI
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1027
query: |-
  // Detects commands used to bypass AMSI
  let cmd_all = dynamic(["amsi.dll"]);
  let cmd_any = dynamic(["system.runtime.interopservices.marshal","amsiopensession"]);
  let query1 = 
  _Im_ProcessCreate(commandline_has_all=cmd_all,commandline_has_any=cmd_any);
  let cmd_all2 = dynamic([".assembly.gettypes"]);
  let cmd_any2 = dynamic(["system.runtime.interopservices.marshal","setvalue($null","getvalue($null"]);
  let query2 = 
  _Im_ProcessCreate(commandline_has_all=cmd_all2,commandline_has_any=cmd_any2);
  union isfuzzy = true query1, query2
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

