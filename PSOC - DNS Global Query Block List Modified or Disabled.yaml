id: 657db2fe-ec46-490b-9786-79c44c2042eb
name: PSOC - DNS Global Query Block List Modified or Disabled via Registry
kind: Scheduled
description: Detects changes to the registry keys for the DNS Global BlockList in Windows
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
- Collection
relevantTechniques:
- T1557
- T1562.001
query: |-
  //detects changes to the registry key for the DNS Global Blocklist 
  let eventtype = dynamic(["RegistryValueSet"]);
  let RegistryValue = dynamic(["EnableGlobalQueryBlockList","GlobalQueryBlockList"]);
  let RegistryKey = dynamic(["HKLM\\SYSTEM\\CurrentControlSet001\\Services\\DNS\\Parameters","HKLM\\SYSTEM\\CurrentControlSet002\\Services\\DNS\\Parameters"]);
  _Im_RegistryEvent(eventtype_in=eventtype,registryvalue_has_any=RegistryValue,registrykey_has_any=RegistryKey)
  | extend
      Computer = tostring(column_ifexists("DvcHostname", "")),
      Account = tostring(column_ifexists("ActorUsername", "")),
      CommandLine = tostring(column_ifexists("ActingProcessCommandLine", "")),
      ProcessId = tostring(column_ifexists("ActingProcessId", ""))
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
alertDetailsOverride:
  alertDynamicProperties: []
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

