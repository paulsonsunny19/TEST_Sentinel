id: dc358086-4a48-4cf3-b9ea-f826984e690b
name: PSOC - Detects suspicious execution of fsutil.exe
kind: Scheduled
description: Detects suspicious execution of fsutil.exe
severity: High
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1562
query: |-
  //Detects suspicious execution of fsutil.exe
  _Im_ProcessCreate
  | where TargetProcessName has "fsutil.exe"
  | where CommandLine has_all ("devdrv","enable","/dissallowAv")
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

