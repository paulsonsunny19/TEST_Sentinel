id: 8564d490-d641-41c9-b898-ce7090c71405
name: PSOC - Rule for Suspicious Certutil Commands usage
kind: Scheduled
description: |-
  Detects the user of certutil to decode commands
  Attackers use this for obfuscation
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
relevantTechniques:
- T1105
query: |-
  // Detects the user of certutil to decode commands
  // Attackers use this for obfuscation
  let cmd_any = dynamic(["-decode","-encode","-verifyctl","-decodehex"]);
  let query1 =
  _Im_ProcessCreate(commandline_has_any=cmd_any,targetprocess_has_any="certutil.exe");
  // Detects suspicious usage of legitimate certutil.exe to download malware payloads
  let cmd_all2 = dynamic(["urlcache","split"]);
  let query2 =
  _Im_ProcessCreate(commandline_has_all=cmd_all2,targetprocess_has_any="certutil.exe");
  union isfuzzy=true
  query1,query2
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessId) or isnotempty(CommandLine)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

