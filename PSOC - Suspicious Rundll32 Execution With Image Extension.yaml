id: 579df582-e82c-4b5d-bd74-8dd3cb498ee1
name: PSOC - Suspicious Rundll32 Execution With Image Extension
kind: Scheduled
description: |-
  Detects suspicious rundll32 eecution using files with image extensions
  This was observed in DFIR reports, the files are not really images.
severity: High
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1218.011
query: |-
  // Detects suspicious rundll32 eecution using files with image extensions
  // This was observed in DFIR reports, the files are not really images.
  let cmd_any = dynamic([".bmp",".cr2",".eps",".gif",".ico",".jpeg",".jpg",".nef",".orf",".png",".raw",".sr2",".tiff",".tif"]);
  _Im_ProcessCreate(commandline_has_any=cmd_any,targetprocess_has_any="rundll32.exe")
  | where CommandLine !has ".dll"
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

