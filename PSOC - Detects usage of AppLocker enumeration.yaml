id: 5397c0f7-2947-41f9-bee7-c6ae5cdf2cca
name: PSOC - Detects usage of AppLocker enumeration
kind: Scheduled
description: |-
  Detects enumeration of applocker
  applocker protects from malicious powershell commands, attackers may enumerate this to determine what is not blocked.
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1218
query: |-
  // Detects enumeration of applocker
  // applocker protects from malicious powershell commands, attackers may enumerate this to determine what is not blocked.
  let cmd_any = dynamic(["get-childitem -path hklm:software\\policies\\microsoft\\windows\\srpv2 -recurse","reg query hkey_local_machine\\software\\policies\\microsoft\\windows\\srpv2\\exe\\","select -expandproperty rulecollections","(get-applockerpolicy -local).rulecollections","get-applockerpolicy -effective -xml"]);
  _Im_ProcessCreate(commandline_has_any=cmd_any)
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

