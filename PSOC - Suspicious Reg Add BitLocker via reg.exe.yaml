id: 41c2e410-2ba2-49fc-90d8-3db49e9b23ea
name: PSOC - Suspicious Reg Add BitLocker via reg.exe
kind: Scheduled
description: detects changes to registry keys that allow attackers to use bitlocker to encrypt data
severity: High
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Impact
relevantTechniques:
- T1486
query: |-
  // Detects modification of bitlocker using the registry
  // threat actors use bitlocker to encrypt files
  let cmd_all = dynamic(["REG","ADD","\\SOFTWARE\\Policies\\Microsoft\\FVE","/v","/f"]);
  let cmd_any = dynamic(["RecoveryKeyMessage","UseTPMPIN","RecoveryKeyMessageSource","UseTPMKeyPIN","UseTPMKey","UseTPM","UseAdvancedStartup","EnableBDEWithNoTPM"]);
  _Im_ProcessCreate(commandline_has_all=cmd_all,commandline_has_any=cmd_any)
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

