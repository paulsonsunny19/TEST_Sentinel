id: 48bd96a8-b5ab-4751-a22d-dfda8158a279
name: PSOC - Attempts of malicious JS execution through node
kind: Scheduled
description: Shai Hulud 2.0 supply chain attack
severity: Medium
queryFrequency: 5m
queryPeriod: 30h
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
relevantTechniques:
- T0862
query: |+
  // Shai Hulud 2.0 supply chain attack
  DeviceProcessEvents 
  | where FileName has "node" and ProcessCommandLine has_any ("setup_bun.js", "bun_environment.js")
  | extend
      Computer = tostring(column_ifexists("DeviceName", "")),
      Account = tostring(column_ifexists("InitiatingProcessAccountName", "")),
      ProcessId = tostring(column_ifexists("ProcessId", "")),
      CommandLine = tostring(column_ifexists("ProcessCommandLine", ""))
  | where isnotempty(Computer)
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
alertDetailsOverride:
  alertDynamicProperties: []
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

