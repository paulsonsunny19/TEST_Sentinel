id: 0109ad3b-1746-42ee-ae6a-d87d7dee2c84
name: PSOC - Windows Credential Manager activity detected
kind: Scheduled
description: |-
  This is a combination of 3 queries designed to detect suspicious activity in Windows Credential Manager. If any single one matches an Incident will open.
  This is a method to bypass authentication on windows
severity: Medium
queryFrequency: 5m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1555
query: |-
  // This is a combination of 3 queries designed to detect suspicious activity in Windows Credential Manager
  // This is a method to bypass authentication on windows 
  let parent_processes = dynamic(["cmd.exe","powershell.exe"]);
  let cmd_all = dynamic(["rundll32","keymgr.dll","KRShowKeyMgr"]);
  let query1 = 
  _Im_ProcessCreate(commandline_has_all=cmd_all,parentprocess_has_any=parent_processes,targetprocess_has_any="rundll32.exe");
  let parent_processes2 = dynamic(["rundll.exe"]);
  let cmd_all2 = dynamic(["credwiz.exe","B"]);
  let query2 = 
  _Im_ProcessCreate(commandline_has_all=cmd_all2,parentprocess_has_any=parent_processes2,targetprocess_has_any="credwiz.exe");
  let cmd_all3 = dynamic(["vaultcmd /listcreds","Windows Credentials"]);
  let query3 =
  _Im_ProcessCreate(commandline_has_all=cmd_all3);
  union isfuzzy=true
  query1,query2,query3
  | extend
      Account = tostring(column_ifexists("ActorUsername", "")),
      AccountDomain = tostring(column_ifexists("ActorUserDomain", "")),
      Computer = tostring(column_ifexists("DvcHostname", "")),
      ProcessName = tostring(column_ifexists("TargetProcessName", "")),
      ProcessId = tostring(column_ifexists("TargetProcessId", "")),
      CommandLine = tostring(column_ifexists("CommandLine", ""))
  | where isnotempty(ProcessName)
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Account
  - identifier: NTDomain
    columnName: AccountDomain
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: ProcessId
    columnName: ProcessId
  - identifier: CommandLine
    columnName: CommandLine
suppressionEnabled: false
suppressionDuration: 5h
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails: []

